site_name: 范凯说AI · X 情报
site_url: https://news.fankai.me/
site_description: 每日 X 情报报告
repo_url: https://github.com/robbin/x-news
theme:
  name: material
  language: zh
  palette:
    scheme: default
    primary: white
    accent: amber
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
plugins:
  - search:
      lang: [zh, en]
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          name: 中文
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_name: Fan Kai on AI · X Intel
          site_description: Daily X intelligence reports
          nav_translations:
            首页: Home
            中文选题: Chinese Topics
            英文选题: English Topics
            X AI 日报: X AI Daily
hooks:
  - hooks/autonav.py
extra:
  generator: false
  social:
    - icon: material/home
      link: https://fankai.me/
      name: 主站 fankai.me
    - icon: material/school
      link: https://fankaishuo.ai/
      name: 教程 fankaishuo.ai
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@fankaishuoai
      name: YouTube
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/fankaishuoai
      name: X
extra_javascript:
  - javascripts/header-links.js
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.superfences
  - pymdownx.magiclink:
      hide_protocol: false
      repo_url_shortener: false
