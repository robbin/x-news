site_name: 范凯说AI · X 新闻
site_url: https://news.fankai.me/
site_description: 范凯的 AI 新闻阅读站：X AI 日报、中英文热点简报与原始来源，连接 AI 实践和个人思考。
theme:
  name: material
  language: zh
  font: false
  custom_dir: overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: amber
      toggle:
        icon: material/weather-night
        name: 深色模式 / Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 浅色模式 / Light mode
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
plugins:
  - search:
      lang: [zh, en]
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          name: 中文
          default: true
          build: true
        - locale: en
          name: English
          build: true
          site_name: Fan Kai on AI · X News
          site_description: AI news and conversations from X, with daily reports, topic briefs and source links.
          nav_translations:
            首页: Home
            中文选题: Chinese Topics
            英文选题: English Topics
            X AI 日报: X AI Daily
hooks:
  - hooks/autonav.py
  - hooks/presentation.py
extra:
  generator: false
  social:
    - icon: material/email-outline
      link: https://fankai.me/subscribe?utm_source=news.fankai.me&utm_medium=website&utm_campaign=personal_articles&utm_content=site_footer
      name: 免费订阅范凯的个人文章（中文）
    - icon: material/home
      link: https://fankai.me/
      name: 主站 fankai.me
    - icon: material/school
      link: https://fankaishuo.ai/
      name: 教程 fankaishuo.ai
    - icon: material/code-braces
      link: https://projects.fankai.me/
      name: 项目 projects.fankai.me
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@fankaishuoai
      name: YouTube
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/fankaishuoai
      name: X
extra_javascript:
  - javascripts/header-links.js
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - attr_list
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.superfences
  - pymdownx.magiclink:
      hide_protocol: false
      repo_url_shortener: false
